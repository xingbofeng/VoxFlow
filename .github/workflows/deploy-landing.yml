name: Deploy Landing

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: all
        type: choice
        options:
          - all
          - vercel
          - lighthouse
          - pages
          - verify-domains
          - dns-vercel
          - dns-lighthouse

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vercel:
    name: Vercel landing page
    runs-on: ubuntu-latest
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'vercel'))
      }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
      WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@54.2.0
      - name: Validate Vercel secrets
        run: |
          set -euo pipefail
          missing=0
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is not configured"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
          vercel whoami --token="${VERCEL_TOKEN}" >/dev/null
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"
      - name: Sync Vercel runtime environment
        run: |
          vercel env rm WECHAT_APP_ID production --yes --token="${VERCEL_TOKEN}" || true
          vercel env rm WECHAT_APP_SECRET production --yes --token="${VERCEL_TOKEN}" || true
          printf '%s' "${WECHAT_APP_ID}" | vercel env add WECHAT_APP_ID production --token="${VERCEL_TOKEN}"
          printf '%s' "${WECHAT_APP_SECRET}" | vercel env add WECHAT_APP_SECRET production --token="${VERCEL_TOKEN}"
      - name: Prepare Vercel landing source
        run: scripts/prepare-vercel-landing.sh
      - name: Deploy landing site to Vercel
        run: vercel deploy .build/vercel-landing --prod --archive=tgz --token="${VERCEL_TOKEN}"

  lighthouse:
    name: Tencent Lighthouse landing page
    runs-on: ubuntu-latest
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'lighthouse'))
      }}
    env:
      LANDING_IMAGE: voxflow-landing:${{ github.sha }}
      TENCENT_NODE_IMAGE: mirror.ccs.tencentyun.com/library/node:20-alpine
      TENCENT_CADDY_IMAGE: mirror.ccs.tencentyun.com/library/caddy:2.8-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Build landing assets
        run: scripts/build-landing-site.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Prepare Lighthouse bundle
        run: |
          rm -rf public
          mkdir -p public
          cp -R .build/landing-site/. public/
      - name: Upload bundle to Lighthouse
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TENCENT_LIGHTHOUSE_HOST }}
          username: ${{ secrets.TENCENT_LIGHTHOUSE_USER }}
          key: ${{ secrets.TENCENT_LIGHTHOUSE_SSH_KEY }}
          source: docker-compose.landing.yml,api/wechat-signature.js,deploy/Caddyfile,deploy/Dockerfile.landing,deploy/landing-server.js,public
          target: /opt/voxflow-landing
      - name: Deploy on Lighthouse
        uses: appleboy/ssh-action@v1.2.0
        env:
          VOXFLOW_LANDING_IMAGE: ${{ env.LANDING_IMAGE }}
          TENCENT_NODE_IMAGE: ${{ env.TENCENT_NODE_IMAGE }}
          TENCENT_CADDY_IMAGE: ${{ env.TENCENT_CADDY_IMAGE }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
        with:
          host: ${{ secrets.TENCENT_LIGHTHOUSE_HOST }}
          username: ${{ secrets.TENCENT_LIGHTHOUSE_USER }}
          key: ${{ secrets.TENCENT_LIGHTHOUSE_SSH_KEY }}
          envs: VOXFLOW_LANDING_IMAGE,TENCENT_NODE_IMAGE,TENCENT_CADDY_IMAGE,WECHAT_APP_ID,WECHAT_APP_SECRET
          script: |
            set -euo pipefail
            cd /opt/voxflow-landing

            printf '%s\n' \
              "VOXFLOW_LANDING_IMAGE=${VOXFLOW_LANDING_IMAGE}" \
              "CADDY_IMAGE=${TENCENT_CADDY_IMAGE}" \
              "WECHAT_APP_ID=${WECHAT_APP_ID}" \
              "WECHAT_APP_SECRET=${WECHAT_APP_SECRET}" \
              > .env

            if docker compose version >/dev/null 2>&1; then
              compose='sudo docker compose'
            else
              compose='sudo docker-compose'
            fi

            sudo docker build \
              --build-arg "NODE_IMAGE=${TENCENT_NODE_IMAGE}" \
              --tag "${VOXFLOW_LANDING_IMAGE}" \
              --tag voxflow-landing:latest \
              --file deploy/Dockerfile.landing \
              .
            ${compose} -f docker-compose.landing.yml up -d --remove-orphans
            ${compose} -f docker-compose.landing.yml ps
            for attempt in $(seq 1 30); do
              landing_status="$(sudo docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' voxflow-landing 2>/dev/null || true)"
              if [ "${landing_status}" = "healthy" ]; then
                break
              fi
              sleep 2
            done
            if [ "${landing_status}" != "healthy" ]; then
              sudo docker logs --tail=80 voxflow-landing
              exit 1
            fi
            ${compose} -f docker-compose.landing.yml exec -T landing wget -qO- http://127.0.0.1:8080/ready
            ${compose} -f docker-compose.landing.yml exec -T caddy caddy validate --config /etc/caddy/Caddyfile
            curl -fsS --max-time 15 --resolve "mashangxie.app:443:127.0.0.1" https://mashangxie.app/ready
            curl -fsS --max-time 15 --resolve "www.mashangxie.app:443:127.0.0.1" https://www.mashangxie.app/ready

  pages:
    name: GitHub Pages landing page
    runs-on: ubuntu-latest
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'pages'))
      }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release metadata
        run: make release-check
      - name: Build landing assets
        run: scripts/build-landing-site.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check deployed GitHub Pages release metadata
        id: deployed_pages
        run: |
          set -euo pipefail
          expected_version="$(python3 - <<'PY'
          import json
          with open("docs/release.json", "r", encoding="utf-8") as handle:
              print(json.load(handle)["version"])
          PY
          )"
          expected_download_url="$(python3 - <<'PY'
          import json
          with open("docs/release.json", "r", encoding="utf-8") as handle:
              print(json.load(handle)["downloadURL"])
          PY
          )"
          if curl -fsSL --max-time 20 "https://xingbofeng.github.io/VoxFlow/release.json" -o /tmp/pages-release.json &&
            python3 - /tmp/pages-release.json "${expected_version}" "${expected_download_url}" <<'PY'
          import json
          import sys

          path, expected_version, expected_download_url = sys.argv[1:4]
          with open(path, "r", encoding="utf-8") as handle:
              release = json.load(handle)
          if release.get("version") != expected_version:
              raise SystemExit(1)
          if release.get("downloadURL") != expected_download_url:
              raise SystemExit(1)
          PY
          then
            echo "current=true" >> "${GITHUB_OUTPUT}"
            echo "GitHub Pages already publishes ${expected_version}"
          else
            echo "current=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Configure Pages
        if: ${{ steps.deployed_pages.outputs.current != 'true' }}
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: ${{ steps.deployed_pages.outputs.current != 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build/landing-site
      - name: Deploy landing page to GitHub Pages
        if: ${{ steps.deployed_pages.outputs.current != 'true' }}
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify GitHub Pages release metadata
        run: |
          set -euo pipefail
          page_url="${{ steps.deployment.outputs.page_url || 'https://xingbofeng.github.io/VoxFlow/' }}"
          curl -fsS "${page_url%/}/release.json" | python3 -m json.tool >/dev/null
          curl -fsS "${page_url%/}/script.js" >/dev/null

  dns:
    name: Cloudflare DNS
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'dns-vercel' || inputs.target == 'dns-lighthouse') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Validate Cloudflare DNS secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TENCENT_LIGHTHOUSE_IP: ${{ secrets.TENCENT_LIGHTHOUSE_IP }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ZONE_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is not configured"
              missing=1
            fi
          done
          if [ "${{ inputs.target }}" = "dns-lighthouse" ] && [ -z "${TENCENT_LIGHTHOUSE_IP:-}" ]; then
            echo "::error::TENCENT_LIGHTHOUSE_IP is not configured"
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
      - name: Upsert apex record for Vercel
        if: ${{ inputs.target == 'dns-vercel' }}
        run: scripts/cloudflare-upsert-record.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_RECORD_NAME: mashangxie.app
          CF_RECORD_TYPE: A
          CF_RECORD_CONTENT: 76.76.21.21
          CF_RECORD_PROXIED: "false"
          CF_RECORD_TTL: "300"
      - name: Upsert www record for Vercel
        if: ${{ inputs.target == 'dns-vercel' }}
        run: scripts/cloudflare-upsert-record.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_RECORD_NAME: www.mashangxie.app
          CF_RECORD_TYPE: A
          CF_RECORD_CONTENT: 76.76.21.21
          CF_RECORD_PROXIED: "false"
          CF_RECORD_TTL: "300"
      - name: Upsert apex record for Lighthouse
        if: ${{ inputs.target == 'dns-lighthouse' }}
        run: scripts/cloudflare-upsert-record.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_RECORD_NAME: mashangxie.app
          CF_RECORD_TYPE: A
          CF_RECORD_CONTENT: ${{ secrets.TENCENT_LIGHTHOUSE_IP }}
          CF_RECORD_PROXIED: "false"
          CF_RECORD_TTL: "300"
      - name: Upsert www record for Lighthouse
        if: ${{ inputs.target == 'dns-lighthouse' }}
        run: scripts/cloudflare-upsert-record.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_RECORD_NAME: www.mashangxie.app
          CF_RECORD_TYPE: A
          CF_RECORD_CONTENT: ${{ secrets.TENCENT_LIGHTHOUSE_IP }}
          CF_RECORD_PROXIED: "false"
          CF_RECORD_TTL: "300"

  verify-domains:
    name: Verify public landing domains
    runs-on: ubuntu-latest
    needs:
      - vercel
      - lighthouse
      - pages
    if: >-
      ${{
        always() &&
        (
          (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
          (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'verify-domains'))
        )
      }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release metadata on custom domains
        run: |
          set -euo pipefail
          expected_version="$(python3 - <<'PY'
          import json
          with open("docs/release.json", "r", encoding="utf-8") as handle:
              print(json.load(handle)["version"])
          PY
          )"
          expected_download_url="$(python3 - <<'PY'
          import json
          with open("docs/release.json", "r", encoding="utf-8") as handle:
              print(json.load(handle)["downloadURL"])
          PY
          )"

          verify_domain() {
            local origin="$1"
            local tmp
            tmp="$(mktemp)"
            for attempt in $(seq 1 30); do
              if curl -fsSL --max-time 20 "${origin}/release.json" -o "${tmp}" &&
                python3 - "${tmp}" "${expected_version}" "${expected_download_url}" <<'PY'
          import json
          import sys

          path, expected_version, expected_download_url = sys.argv[1:4]
          with open(path, "r", encoding="utf-8") as handle:
              release = json.load(handle)

          if release.get("version") != expected_version:
              raise SystemExit(
                  f"expected version {expected_version}, got {release.get('version')}"
              )
          if release.get("downloadURL") != expected_download_url:
              raise SystemExit(
                  "downloadURL mismatch: "
                  f"expected {expected_download_url}, got {release.get('downloadURL')}"
              )
          PY
              then
                echo "${origin} release metadata is current (${expected_version})"
                rm -f "${tmp}"
                return 0
              fi
              echo "Waiting for ${origin} to publish ${expected_version} (attempt ${attempt}/30)"
              sleep 10
            done
            echo "::error::${origin}/release.json did not publish ${expected_version}"
            echo "Last response:"
            cat "${tmp}" || true
            rm -f "${tmp}"
            return 1
          }

          verify_domain "https://mashangxie.app"
          verify_domain "https://www.mashangxie.app"
