name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust_agent: ${{ steps.detect.outputs.rust_agent }}
      voice_correction_benchmark: ${{ steps.detect.outputs.voice_correction_benchmark }}
      context_boost_benchmark: ${{ steps.detect.outputs.context_boost_benchmark }}
      r2t2_core_tests: ${{ steps.detect.outputs.r2t2_core_tests }}
      ios: ${{ steps.detect.outputs.ios }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: detect
        run: bash scripts/ci-detect-changed-paths.sh

  # 单元测试与静态检查。iOS 模拟器测试和 R2T2 子包测试已拆到独立 job 并行执行：
  # 这三块互不依赖，之前串在同一个 job 里，46 分钟的关键路径有 86% 耗在三个测试步骤上。
  checks:
    name: Test and build macOS app
    needs: changes
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check release metadata
        run: make release-check

      - name: Test release metadata preparation
        run: python3 Tests/ReleaseMetadataTests/test_release_metadata.py

      - name: Test release platform contract
        run: python3 Tests/ReleaseMetadataTests/test_release_platforms.py

      - name: Test release asset publication gate
        run: python3 Tests/ReleaseMetadataTests/test_release_assets_published.py

      - name: Test deployed landing release metadata verification
        run: python3 Tests/ReleaseMetadataTests/test_deployed_release_metadata.py

      - name: Show Swift toolchain
        run: swift --version

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/plugins
            .build/repositories
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Cache sherpa-onnx runtime
        uses: actions/cache@v4
        with:
          path: Vendor/sherpa-onnx.xcframework
          key: ${{ runner.os }}-sherpa-onnx-${{ hashFiles('scripts/bootstrap-sherpa-onnx.sh') }}

      - name: Prepare sherpa-onnx runtime
        run: ./scripts/bootstrap-sherpa-onnx.sh

      # -warnings-as-errors 直接加在 swift test 上，合并掉原来单独的一次 debug 构建：
      # 之前 Run tests 已经 debug 编译过一遍，再单独编一次只为了检查 warning。
      # 注意这同时把测试 target 也纳入 warning 门禁。
      - name: Run tests
        run: |
          start=$(date +%s)
          swift_build_jobs="$(sysctl -n hw.logicalcpu)"
          swift_test_workers=8
          VOXFLOW_TEST_INTERFACE_LANGUAGE=zh-Hans swift test --parallel --num-workers "$swift_test_workers" --jobs "$swift_build_jobs" -Xswiftc -warnings-as-errors
          duration=$(( $(date +%s) - start ))
          echo "### CI timing" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: |" >> "$GITHUB_STEP_SUMMARY"
          echo "| swift test --parallel --num-workers $swift_test_workers --jobs $swift_build_jobs -Xswiftc -warnings-as-errors | $duration |" >> "$GITHUB_STEP_SUMMARY"

      - name: Run voice correction benchmark
        if: needs.changes.outputs.voice_correction_benchmark == 'true'
        run: |
          swift run --package-path Packages/VoxFlowVoiceCorrectionKit VoxFlowVoiceCorrectionBench \
            --fixtures Packages/VoxFlowVoiceCorrectionKit/Benchmarks/Fixtures \
            --baseline Packages/VoxFlowVoiceCorrectionKit/Benchmarks/Baselines/phase1-baseline.json \
            --output .build/voice-correction-benchmark

      - name: Run context boost benchmark
        if: needs.changes.outputs.context_boost_benchmark == 'true'
        run: swift run --package-path Packages/VoxFlowContextBoostKit VoxFlowContextBoostBench

      - name: Show Rust toolchain
        if: needs.changes.outputs.rust_agent == 'true'
        run: |
          rustc --version
          cargo --version
          rustup component add rustfmt clippy

      - name: Cache Rust agent router build
        if: needs.changes.outputs.rust_agent == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-cli

      - name: Check Rust agent router
        if: needs.changes.outputs.rust_agent == 'true'
        working-directory: agent-cli
        run: |
          start=$(date +%s)
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          duration=$(( $(date +%s) - start ))
          echo "| Rust fmt/clippy/test | $duration |" >> "$GITHUB_STEP_SUMMARY"

      - name: Check helper script syntax
        run: |
          bash -n agent-cli/vox
          bash -n scripts/ci-detect-changed-paths.sh

      - name: Check architecture boundaries
        run: make architecture-check

  # lint/i18n 从 checks 拆出：brew install（2-5 分钟）不再挡在 swift test 前面，
  # 与测试作业并行执行。
  lint:
    name: Lint and i18n
    needs: changes
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install lint and localization tools
        run: brew install swiftlint bartycrouch swiftgen

      - name: Run SwiftLint
        run: make lint

      - name: Run i18n checks
        run: make i18n-check

  ios-sim:
    name: iOS simulator tests
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # rime-ice 源码克隆缓存。Schemas 缓存未命中时（首次运行、或 rime revision 变更）仍可用，
      # 避免从 GitHub 重新克隆；key 跟着脚本走，脚本里写着 RIME_ICE_REVISION 与 BOOTSTRAP_VERSION。
      - name: Cache iOS Rime Ice clone
        uses: actions/cache@v4
        with:
          path: .build/ios-rime-ice
          key: ${{ runner.os }}-ios-rime-ice-${{ hashFiles('Apps/VoxFlowiOS/Scripts/bootstrap-rime-ice-schemas.sh') }}

      # 把物化后的整个 Schemas 目录一起缓存（121M）：里面既有 .rime-ice-revision 戳，也有预编译的
      # build/（含 rime_ice.table.bin，占 73M）。两者必须同进同出——bootstrap 脚本只有在戳匹配时
      # 才早退，否则会 rm -rf 整个 Schemas 目录，把刚 restore 出来的预编译产物一起删掉，缓存就白做了。
      # 又因为 Makefile 只按 rime_ice.table.bin 是否存在来决定要不要重建，这里必须用精确 key、
      # 不能配 restore-keys：一旦 restore 到旧表，会跳过重建并让测试跑在过期 schema 上。
      # 命中后 ios-rime-prebuild-if-needed 直接跳过，省掉一次完整的 RimeNativeRuntimeTests 构建+运行
      # （实测约 400 秒，且 ios-sim 与 package-ios 两个 job 各跑一遍）。
      - name: Cache iOS Rime schemas and prebuilt runtime
        uses: actions/cache@v4
        with:
          path: Apps/VoxFlowiOS/ChineseInput/Resources/Schemas
          key: ${{ runner.os }}-ios-rime-schemas-${{ hashFiles('Apps/VoxFlowiOS/Scripts/bootstrap-rime-ice-schemas.sh', 'Apps/VoxFlowiOS/project.yml', 'Apps/VoxFlowiOS/ChineseInput/Sources/**', 'Apps/VoxFlowiOS/ChineseInput/RimeKitObjC/**', 'Apps/VoxFlowiOS/ChineseInput/NativeProbe/**', 'Apps/VoxFlowiOS/ChineseInput/Upstream/**', 'Apps/VoxFlowiOS/ChineseInput/Frameworks/librime.xcframework/Info.plist') }}

      # DerivedData 里只有这三块值得缓存（完整目录 6.3G，其中 SourcePackages 占 4.2G）。
      # Xcode 的增量构建按内容判断，复用旧 DerivedData 是安全的；用 sha + 前缀 restore-keys
      # 拿到增量编译而不是冷编译。
      - name: Cache iOS DerivedData
        uses: actions/cache@v4
        with:
          path: |
            .build/ios/DerivedData/Build/Intermediates.noindex
            .build/ios/DerivedData/Build/Products
            .build/ios/DerivedData/ModuleCache.noindex
          key: ${{ runner.os }}-ios-deriveddata-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ios-deriveddata-

      - name: Run iOS simulator tests
        run: |
          start=$(date +%s)
          make ios-test-sim
          duration=$(( $(date +%s) - start ))
          echo "### CI timing" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: |" >> "$GITHUB_STEP_SUMMARY"
          echo "| make ios-test-sim | $duration |" >> "$GITHUB_STEP_SUMMARY"

  r2t2-core:
    name: R2T2 core tests
    needs: changes
    if: needs.changes.outputs.r2t2_core_tests == 'true'
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 子包有自己的 .build（含 mlx-swift、swift-transformers），不在根目录 SwiftPM 缓存覆盖范围内，
      # 之前每次都是冷编译。编译产物（.build/arm64-apple-macosx）占大头，缓存整个 .build。
      - name: Cache R2T2 package build
        uses: actions/cache@v4
        with:
          path: Packages/VoxFlowR2T2Core/.build
          key: ${{ runner.os }}-r2t2-package-${{ hashFiles('Packages/VoxFlowR2T2Core/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-r2t2-package-

      - name: Run R2T2 core tests
        run: |
          start=$(date +%s)
          make test-r2t2-core
          duration=$(( $(date +%s) - start ))
          echo "### CI timing" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: |" >> "$GITHUB_STEP_SUMMARY"
          echo "| make test-r2t2-core | $duration |" >> "$GITHUB_STEP_SUMMARY"

  package-macos:
    name: Package signed macOS DMG
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # make build / make dmg 走 --scratch-path .build/swiftpm-xcode16（见 Makefile SWIFT_PACKAGE_FLAGS），
      # 依赖会被解析到该 scratch 下面。这里以前缓存的却是 .build/{artifacts,checkouts,plugins,repositories}，
      # 与真实 scratch 不一致：restore 出来的 1.6G 构建从不读取，于是每次仍然重新拉取 106 个依赖
      # （实测 153 秒，03:34:03→03:36:36）。key 用独立的 -xcode16-swiftpm- 前缀：既不与 checks job 的
      # .build 缓存互相覆盖内容，也不落进它的 restore-keys 前缀（macOS-swiftpm-）里被误 restore。
      - name: Cache SwiftPM dependencies for xcode16 scratch
        uses: actions/cache@v4
        with:
          path: |
            .build/swiftpm-xcode16/artifacts
            .build/swiftpm-xcode16/checkouts
            .build/swiftpm-xcode16/plugins
            .build/swiftpm-xcode16/repositories
          key: ${{ runner.os }}-xcode16-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode16-swiftpm-

      # MLX 的 33 个 Metal 源每次都由 build-mlx-metallib.sh 重新编译，实测 248 秒
      # （03:48:18→03:52:26）。该脚本自己会把 kernels 下 .metal/.h 的内容哈希写进 .mlx.metallib.sha，
      # 命中就早退并重新 cp 出 default.metallib，所以只缓存 mlx.metallib 与哈希戳即可：
      # 既省掉一半缓存体积，也让 MLX 版本变化时缓存在脚本内部自动失效。
      - name: Cache MLX metallib
        uses: actions/cache@v4
        with:
          path: |
            .build/swiftpm-xcode16/*-apple-macosx/release/mlx.metallib
            .build/swiftpm-xcode16/*-apple-macosx/release/.mlx.metallib.sha
          key: ${{ runner.os }}-mlx-metallib-${{ hashFiles('scripts/build-mlx-metallib.sh', 'Package.resolved') }}

      - name: Cache sherpa-onnx runtime
        uses: actions/cache@v4
        with:
          path: Vendor/sherpa-onnx.xcframework
          key: ${{ runner.os }}-sherpa-onnx-${{ hashFiles('scripts/bootstrap-sherpa-onnx.sh') }}

      - name: Prepare sherpa-onnx runtime
        run: ./scripts/bootstrap-sherpa-onnx.sh

      - name: Configure macOS distribution signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.VOXFLOW_RELEASE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.VOXFLOW_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          certificate_path="$RUNNER_TEMP/voxflow-release.p12"
          keychain_path="$RUNNER_TEMP/voxflow-release.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          certificate_sha1="$(security find-certificate -a -Z "$keychain_path" | awk '/SHA-1 hash:/ { print $3; exit }')"
          test -n "$certificate_sha1"
          echo "VOXFLOW_RELEASE_SIGNING_IDENTITY=$certificate_sha1" >> "$GITHUB_ENV"
          echo "VOXFLOW_RELEASE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Build signed DMG
        env:
          VOXFLOW_SENTRY_DSN: ${{ secrets.VOXFLOW_SENTRY_DSN }}
        run: |
          make dmg \
            RELEASE_CODE_SIGN_IDENTITY="$VOXFLOW_RELEASE_SIGNING_IDENTITY" \
            RELEASE_KEYCHAIN_PATH="$VOXFLOW_RELEASE_KEYCHAIN_PATH"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: VoxFlow-macOS
          path: |
            dist/VoxFlow-*-macOS.dmg
            dist/VoxFlow-*-macOS.dmg.sha256
          if-no-files-found: error

  package-ios:
    name: Package unsigned iOS IPA contract
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned iOS IPA contract
        run: make ios-ipa-unsigned

      - name: Upload unsigned iOS IPA contract
        uses: actions/upload-artifact@v4
        with:
          name: Mashangxie-iOS-unsigned
          path: dist/ios/Mashangxie-unsigned.ipa
          if-no-files-found: error
