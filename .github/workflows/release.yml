name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      run_quality_gates:
        description: "Run full tests, benchmarks, Rust checks, architecture check, and debug warning build before packaging"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

jobs:
  release_metadata:
    name: Validate declared release platforms
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      platforms: ${{ steps.release.outputs.platforms }}
      ios_enabled: ${{ steps.release.outputs.ios_enabled }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check release metadata
        run: make release-check

      - name: Read declared release platforms
        id: release
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.release_platforms import validate_release_assets

          metadata = json.loads(Path("docs/release.json").read_text(encoding="utf-8"))
          platforms = validate_release_assets(metadata)
          version = metadata["version"]
          if not isinstance(version, str) or not version:
              raise ValueError("release.version must be a non-empty string.")

          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              expected_tag = f"v{version}"
              if os.environ.get("GITHUB_REF_NAME") != expected_tag:
                  raise ValueError(
                      f"Release tag must be {expected_tag}, got {os.environ.get('GITHUB_REF_NAME')!r}."
                  )

          outputs = {
              "version": version,
              "platforms": ",".join(platforms),
              "ios_enabled": "true" if "ios" in platforms else "false",
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key, value in outputs.items():
                  output.write(f"{key}={value}\n")
          PY

  macos:
    name: Build macOS release
    needs: release_metadata
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/plugins
            .build/repositories
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Cache sherpa-onnx runtime
        uses: actions/cache@v4
        with:
          path: Vendor/sherpa-onnx.xcframework
          key: ${{ runner.os }}-sherpa-onnx-${{ hashFiles('scripts/bootstrap-sherpa-onnx.sh') }}

      - name: Prepare sherpa-onnx runtime
        run: ./scripts/bootstrap-sherpa-onnx.sh

      - name: Check release metadata
        env:
          VOXFLOW_RELEASE_CHECK_REQUIRE_SENTRY: "1"
          VOXFLOW_SENTRY_DSN: ${{ secrets.VOXFLOW_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: make release-check

      - name: Verify release version metadata
        id: version
        run: |
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Sources/VoxFlowApp/Resources/Info.plist)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            test "$TAG_VERSION" = "$PLIST_VERSION"
          fi
          test -f ".github/release-notes/v${PLIST_VERSION}.md"
          echo "value=$PLIST_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_quality_gates == true
        run: |
          start=$(date +%s)
          swift_build_jobs="$(sysctl -n hw.logicalcpu)"
          swift_test_workers=8
          VOXFLOW_TEST_INTERFACE_LANGUAGE=zh-Hans swift test --parallel --num-workers "$swift_test_workers" --jobs "$swift_build_jobs"
          duration=$(( $(date +%s) - start ))
          echo "### Release timing" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: |" >> "$GITHUB_STEP_SUMMARY"
          echo "| swift test --parallel --num-workers $swift_test_workers --jobs $swift_build_jobs | $duration |" >> "$GITHUB_STEP_SUMMARY"

      - name: Run voice correction benchmark
        if: github.event_name == 'workflow_dispatch' && inputs.run_quality_gates == true
        run: |
          swift run --package-path Packages/VoxFlowVoiceCorrectionKit VoxFlowVoiceCorrectionBench \
            --fixtures Packages/VoxFlowVoiceCorrectionKit/Benchmarks/Fixtures \
            --baseline Packages/VoxFlowVoiceCorrectionKit/Benchmarks/Baselines/phase1-baseline.json \
            --output .build/voice-correction-benchmark

      - name: Run context boost benchmark
        if: github.event_name == 'workflow_dispatch' && inputs.run_quality_gates == true
        run: swift run --package-path Packages/VoxFlowContextBoostKit VoxFlowContextBoostBench

      - name: Show Rust toolchain
        if: github.event_name == 'workflow_dispatch' && inputs.run_quality_gates == true
        run: |
          rustc --version
          cargo --version
          rustup component add rustfmt clippy

      - name: Check Rust agent router
        if: github.event_name == 'workflow_dispatch' && inputs.run_quality_gates == true
        working-directory: agent-cli
        run: |
          start=$(date +%s)
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          duration=$(( $(date +%s) - start ))
          echo "| Rust fmt/clippy/test | $duration |" >> "$GITHUB_STEP_SUMMARY"

      - name: Check helper script syntax
        if: github.event_name == 'workflow_dispatch' && inputs.run_quality_gates == true
        run: |
          bash -n agent-cli/vox

      - name: Check architecture boundaries
        if: github.event_name == 'workflow_dispatch' && inputs.run_quality_gates == true
        run: make architecture-check

      - name: Build with warnings as errors
        if: github.event_name == 'workflow_dispatch' && inputs.run_quality_gates == true
        run: |
          start=$(date +%s)
          swift build -c debug -Xswiftc -warnings-as-errors
          duration=$(( $(date +%s) - start ))
          echo "| debug warnings-as-errors build | $duration |" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure release signing identity
        timeout-minutes: 3
        env:
          RELEASE_CERTIFICATE_P12_BASE64: ${{ secrets.VOXFLOW_RELEASE_CERTIFICATE_P12_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.VOXFLOW_RELEASE_CERTIFICATE_PASSWORD }}
          RELEASE_SIGNING_IDENTITY: ${{ secrets.VOXFLOW_RELEASE_SIGNING_IDENTITY }}
        run: |
          test -n "$RELEASE_CERTIFICATE_P12_BASE64"
          test -n "$RELEASE_CERTIFICATE_PASSWORD"
          test -n "$RELEASE_SIGNING_IDENTITY"
          CERTIFICATE_PATH="$RUNNER_TEMP/voxflow-release-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/voxflow-release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$RELEASE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$RELEASE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          CERTIFICATE_SHA1=$(security find-certificate -a -Z "$KEYCHAIN_PATH" | awk '/SHA-1 hash:/ { print $3; exit }')
          test -n "$CERTIFICATE_SHA1"
          echo "VOXFLOW_RELEASE_SIGNING_IDENTITY=$CERTIFICATE_SHA1" >> "$GITHUB_ENV"
          echo "VOXFLOW_RELEASE_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "VOXFLOW_RELEASE_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Cache MLX metallib
        id: mlx-metallib-cache
        uses: actions/cache@v4
        with:
          path: |
            .build/release/mlx.metallib
            .build/release/.mlx.metallib.sha
          key: ${{ runner.os }}-${{ runner.arch }}-mlx-metallib-${{ hashFiles('Package.resolved', 'scripts/build-mlx-metallib.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mlx-metallib-

      - name: Build release DMG
        env:
          VOXFLOW_SENTRY_DSN: ${{ secrets.VOXFLOW_SENTRY_DSN }}
        run: |
          start=$(date +%s)
          security unlock-keychain -p "$VOXFLOW_RELEASE_KEYCHAIN_PASSWORD" "$VOXFLOW_RELEASE_KEYCHAIN_PATH"
          security list-keychains -d user -s "$VOXFLOW_RELEASE_KEYCHAIN_PATH"
          make dmg \
            RELEASE_CODE_SIGN_IDENTITY="$VOXFLOW_RELEASE_SIGNING_IDENTITY" \
            RELEASE_KEYCHAIN_PATH="$VOXFLOW_RELEASE_KEYCHAIN_PATH"
          duration=$(( $(date +%s) - start ))
          echo "### Release timing" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: |" >> "$GITHUB_STEP_SUMMARY"
          echo "| make dmg | $duration |" >> "$GITHUB_STEP_SUMMARY"
          echo "| MLX metallib cache hit | ${{ steps.mlx-metallib-cache.outputs.cache-hit || 'false' }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Install sentry-cli
        run: |
          if ! command -v sentry-cli >/dev/null 2>&1; then
            curl -sL https://sentry.io/get-cli/ | bash
          fi
          sentry-cli --version

      - name: Upload dSYM to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: scripts/upload-sentry-dsym.sh .build/release/VoxFlow.app .build/release/VoxFlow.app.dSYM

      - name: Verify release assets
        run: |
          codesign --verify --deep --strict .build/release/VoxFlow.app
          CERTIFICATE_DIR="$(mktemp -d)"
          (
            cd "$CERTIFICATE_DIR"
            codesign -d --extract-certificates "$GITHUB_WORKSPACE/.build/release/VoxFlow.app"
          )
          APP_CERTIFICATE_SHA1=$(openssl x509 -inform DER -in "$CERTIFICATE_DIR/codesign0" -noout -fingerprint -sha1 | awk -F= '{ print $2 }' | tr -d :)
          rm -rf "$CERTIFICATE_DIR"
          test "$APP_CERTIFICATE_SHA1" = "$VOXFLOW_RELEASE_SIGNING_IDENTITY"
          lipo .build/release/VoxFlow.app/Contents/MacOS/VoxFlow -verify_arch arm64
          shasum -a 256 -c dist/VoxFlow-${{ steps.version.outputs.value }}-macOS.dmg.sha256

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/VoxFlow-${{ steps.version.outputs.value }}-macOS.dmg
            dist/VoxFlow-${{ steps.version.outputs.value }}-macOS.dmg.sha256
          if-no-files-found: error

  windows:
    name: Build Windows release
    needs: release_metadata
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.0 --profile minimal --target x86_64-pc-windows-msvc
          rustup default 1.97.0

      - name: Restore and validate Windows release inputs
        shell: pwsh
        run: |
          dotnet restore VoxFlow.Windows/VoxFlow.Windows.sln -p:Platform=x64
          ./VoxFlow.Windows/scripts/check-localization.ps1
          ./VoxFlow.Windows/scripts/check-nuget-security.ps1 -SolutionPath ./VoxFlow.Windows/VoxFlow.Windows.sln
          ./VoxFlow.Windows/scripts/check-license-inventory.ps1 `
            -SolutionPath ./VoxFlow.Windows/VoxFlow.Windows.sln `
            -NoticesPath ./VoxFlow.Windows/THIRD-PARTY-NOTICES.md
          ./VoxFlow.Windows/scripts/check-cargo-license-inventory.ps1

      - name: Scan release inputs for credentials
        shell: bash
        run: bash VoxFlow.Windows/scripts/check-no-secrets.sh

      - name: Stage Windows native runtimes
        shell: pwsh
        run: |
          ./VoxFlow.Windows/scripts/stage-ffmpeg-runtime.ps1
          ./VoxFlow.Windows/scripts/build-qwen-production-bridge.ps1 `
            -OutputPath ./VoxFlow.Windows/artifacts/native/qwen_asr.dll

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer and portable package
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content ./docs/release.json | ConvertFrom-Json).version
          ./VoxFlow.Windows/scripts/prepare-windows-release.ps1 `
            -Version $version `
            -NativeDllPath ./VoxFlow.Windows/artifacts/native/qwen_asr.dll `
            -OutputRoot ./VoxFlow.Windows/artifacts/release
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            VoxFlow.Windows/artifacts/release/installer/VoxFlow-${{ steps.version.outputs.value }}-windows-x64-setup.exe
            VoxFlow.Windows/artifacts/release/VoxFlow-${{ steps.version.outputs.value }}-windows-x64-portable.zip
          if-no-files-found: error

  ios:
    name: Build installable iOS release
    needs: release_metadata
    if: needs.release_metadata.outputs.ios_enabled == 'true'
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install iOS distribution certificate and profiles
        id: signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.MASHANGXIE_IOS_DISTRIBUTION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MASHANGXIE_IOS_DISTRIBUTION_P12_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.MASHANGXIE_IOS_APP_PROFILE_BASE64 }}
          KEYBOARD_PROFILE_BASE64: ${{ secrets.MASHANGXIE_IOS_KEYBOARD_PROFILE_BASE64 }}
        run: |
          require_secret() {
            name="$1"
            value="$2"
            test -n "$value" || { echo "::error::Missing Actions secret: $name"; exit 2; }
          }
          require_secret MASHANGXIE_IOS_DISTRIBUTION_P12_BASE64 "$CERTIFICATE_BASE64"
          require_secret MASHANGXIE_IOS_DISTRIBUTION_P12_PASSWORD "$CERTIFICATE_PASSWORD"
          require_secret MASHANGXIE_IOS_APP_PROFILE_BASE64 "$APP_PROFILE_BASE64"
          require_secret MASHANGXIE_IOS_KEYBOARD_PROFILE_BASE64 "$KEYBOARD_PROFILE_BASE64"
          require_secret MASHANGXIE_IOS_TEAM_ID "${{ secrets.MASHANGXIE_IOS_TEAM_ID }}"
          keychain_path="$RUNNER_TEMP/mashangxie-ios.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          certificate_path="$RUNNER_TEMP/mashangxie-ios.p12"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          install_profile() {
            encoded="$1"
            prefix="$2"
            source_path="$RUNNER_TEMP/$prefix.mobileprovision"
            plist_path="$RUNNER_TEMP/$prefix.plist"
            printf '%s' "$encoded" | base64 --decode > "$source_path"
            security cms -D -i "$source_path" > "$plist_path"
            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist_path")"
            name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist_path")"
            cp "$source_path" "$profiles_dir/$uuid.mobileprovision"
            echo "${prefix}_profile=$name" >> "$GITHUB_OUTPUT"
          }
          install_profile "$APP_PROFILE_BASE64" app
          install_profile "$KEYBOARD_PROFILE_BASE64" keyboard

      - name: Build Ad Hoc IPA
        run: |
          make ios-ipa \
            MASHANGXIE_DEVELOPMENT_TEAM="${{ secrets.MASHANGXIE_IOS_TEAM_ID }}" \
            MASHANGXIE_APP_PROFILE_SPECIFIER="${{ steps.signing.outputs.app_profile }}" \
            MASHANGXIE_KEYBOARD_PROFILE_SPECIFIER="${{ steps.signing.outputs.keyboard_profile }}"

      - name: Upload iOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: |
            dist/ios/Mashangxie-*-iOS.ipa
            dist/ios/Mashangxie-*-iOS.ipa.sha256
          if-no-files-found: error

  publish:
    name: Publish multiplatform GitHub Release
    needs: [release_metadata, macos, windows, ios]
    if: >-
      ${{
        always() &&
        github.ref_type == 'tag' &&
        needs.release_metadata.result == 'success' &&
        needs.macos.result == 'success' &&
        needs.windows.result == 'success' &&
        (
          needs.release_metadata.outputs.ios_enabled != 'true' ||
          needs.ios.result == 'success'
        )
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: dist/release

      - name: Download Windows release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist/release

      - name: Download iOS release artifacts
        if: needs.release_metadata.outputs.ios_enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-ios
          path: dist/release

      - name: Verify selected release asset set
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release_metadata.outputs.version }}
          RELEASE_PLATFORMS: ${{ needs.release_metadata.outputs.platforms }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from scripts.release_platforms import ASSET_KINDS, validate_release_assets

          metadata = json.loads(Path("docs/release.json").read_text(encoding="utf-8"))
          platforms = validate_release_assets(metadata)
          version = metadata["version"]
          if version != os.environ["RELEASE_VERSION"]:
              raise ValueError("Release metadata output version does not match docs/release.json.")
          if ",".join(platforms) != os.environ["RELEASE_PLATFORMS"]:
              raise ValueError("Release metadata output platforms do not match docs/release.json.")

          release_directory = Path("dist/release")
          expected_names = []
          for platform in platforms:
              for kind in ASSET_KINDS[platform]:
                  asset_name = metadata["assets"][platform][kind]["name"]
                  asset_path = release_directory / asset_name
                  if not asset_path.is_file():
                      raise FileNotFoundError(f"Missing release asset: {asset_path}")
                  expected_names.append(asset_name)

                  if platform in {"macos", "ios"}:
                      checksum_path = release_directory / f"{asset_name}.sha256"
                      if not checksum_path.is_file():
                          raise FileNotFoundError(f"Missing release checksum: {checksum_path}")
                      expected_checksum = checksum_path.read_text(encoding="utf-8").split()[0]
                      actual_checksum = hashlib.sha256(asset_path.read_bytes()).hexdigest()
                      if expected_checksum != actual_checksum:
                          raise ValueError(f"Checksum does not match release asset: {asset_path}")
                      expected_names.append(checksum_path.name)

          published_names = sorted(path.name for path in release_directory.iterdir() if path.is_file())
          if published_names != sorted(expected_names):
              raise ValueError(
                  f"Release artifact set does not match declared platforms: {published_names!r}"
              )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"value={version}\n")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VoxFlow ${{ steps.version.outputs.value }}
          body_path: .github/release-notes/v${{ steps.version.outputs.value }}.md
          files: dist/release/*
          fail_on_unmatched_files: true
          overwrite_files: true

  deploy_pages:
    name: Deploy landing page
    needs: publish
    if: needs.publish.result == 'success' && github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger landing page deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-landing.yml --repo xingbofeng/VoxFlow --ref main -f target=all
