name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  release_ready:
    name: Verify documented release assets are published
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.verify.outputs.ready }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify documented GitHub Release assets
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-release-assets-published.py --github-output "$GITHUB_OUTPUT"

  deploy:
    name: Deploy landing page
    needs: release_ready
    if: ${{ needs.release_ready.outputs.ready == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check release metadata
        run: make release-check

      - name: Build landing assets
        run: scripts/build-landing-site.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check deployed GitHub Pages release metadata
        id: deployed_pages
        run: |
          set -euo pipefail
          if curl -fsSL --max-time 20 "https://xingbofeng.github.io/VoxFlow/release.json" -o /tmp/pages-release.json &&
            python3 scripts/check-deployed-release-metadata.py \
              --expected docs/release.json \
              --actual /tmp/pages-release.json
          then
            echo "current=true" >> "${GITHUB_OUTPUT}"
            echo "GitHub Pages already publishes the complete documented release metadata"
          else
            echo "current=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Configure Pages
        if: ${{ steps.deployed_pages.outputs.current != 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ steps.deployed_pages.outputs.current != 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build/landing-site

      - name: Deploy landing page to GitHub Pages
        if: ${{ steps.deployed_pages.outputs.current != 'true' }}
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify GitHub Pages release metadata
        run: |
          set -euo pipefail
          page_url="${{ steps.deployment.outputs.page_url || 'https://xingbofeng.github.io/VoxFlow/' }}"
          verified=false
          for attempt in $(seq 1 30); do
            if curl -fsS "${page_url%/}/release.json" -o /tmp/pages-release.json &&
              python3 scripts/check-deployed-release-metadata.py \
                --expected docs/release.json \
                --actual /tmp/pages-release.json
            then
              verified=true
              break
            fi
            echo "Waiting for ${page_url%/}/release.json to publish complete release metadata (attempt ${attempt}/30)"
            sleep 10
          done
          if [ "${verified}" != "true" ]; then
            echo "::error::${page_url%/}/release.json did not publish complete release metadata"
            exit 1
          fi
          curl -fsS "${page_url%/}/script.js" >/dev/null
