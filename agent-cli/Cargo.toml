[package]
name = "voxflow"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "voxflow"
path = "src/main.rs"
required-features = ["full-cli"]

[[bin]]
name = "voxflow-agent"
path = "src/voxflow_agent.rs"
required-features = ["builtin-agent"]

[features]
default = ["full-cli", "builtin-agent"]
builtin-agent = []
full-cli = [
    "dep:clap",
    "dep:crossterm",
    "dep:dirs",
    "dep:fs2",
    "dep:portable-pty",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:unicode-normalization",
    "dep:uuid",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
crossterm = { version = "0.29", optional = true }
dirs = { version = "6", optional = true }
fs2 = { version = "0.4", optional = true }
portable-pty = { version = "0.9", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full", "signal"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
unicode-normalization = { version = "0.1", optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
