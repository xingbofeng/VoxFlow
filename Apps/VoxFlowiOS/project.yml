name: VoxFlowiOS
options:
  bundleIdPrefix: com.mashangxie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: arm64
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "YES"
    "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    GENERATE_INFOPLIST_FILE: "NO"
    ENABLE_CODE_COVERAGE: "NO"
    CLANG_COVERAGE_MAPPING: "NO"
    GCC_GENERATE_TEST_COVERAGE_FILES: "NO"
    GCC_INSTRUMENT_PROGRAM_FLOW_ARCS: "NO"

packages:
  VoxFlow:
    path: ../..

targets:
  Mashangxie:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VoxFlowiOS
        excludes:
          - "Info.plist"
          - "Mashangxie.entitlements"
    resources:
      - VoxFlowiOS/Resources
    info:
      path: VoxFlowiOS/Info.plist
      properties:
        CFBundleDisplayName: 码上写
        CFBundleShortVersionString: "1.15.0"
        CFBundleVersion: "26"
        UILaunchScreen:
          UIColorName: ""
        NSMicrophoneUsageDescription: "码上写需要麦克风权限以进行语音听写。"
        NSSpeechRecognitionUsageDescription: "码上写使用系统语音识别作为可选 Provider。"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - armv7
        MinimumOSVersion: "17.0"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.mashangxie.ios
            CFBundleURLSchemes:
              - mashangxie
    entitlements:
      path: VoxFlowiOS/Mashangxie.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mashangxie.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mashangxie.ios
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IOS_IPAD: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: VoxFlowiOS/Mashangxie.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(MASHANGXIE_APP_PROFILE_SPECIFIER)
        SWIFT_OBJC_BRIDGING_HEADER: VoxFlowiOS/Dictation/DictusApp-Bridging-Header.h
    postBuildScripts:
      - name: Copy Dev Cloud Credentials
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          python3 "$SRCROOT/Scripts/write-dev-cloud-resource.py" "$SRCROOT/Generated/DevCloudCredentials.plist"
          cp "$SRCROOT/Generated/DevCloudCredentials.plist" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/DevCloudCredentials.plist"
    dependencies:
      - target: Shared
      - target: MashangxieKeyboard
        embed: true
      - target: ChineseInput
        embed: true
      - target: RimeKitObjC
        embed: true
      - package: VoxFlow
        product: VoxFlowMobileCore
      - package: VoxFlow
        product: VoxFlowASRRuntime
      - package: VoxFlow
        product: VoxFlowAudio
      - package: VoxFlow
        product: VoxFlowProviderCloudCore
      - package: VoxFlow
        product: VoxFlowProviderApple
      - package: VoxFlow
        product: VoxFlowProviderTencentCloud
      - package: VoxFlow
        product: VoxFlowProviderAliyunDashScope
      - package: VoxFlow
        product: VoxFlowProviderVolcengine

  MashangxieKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Keyboard
        excludes:
          - "Info.plist"
          - "Keyboard.entitlements"
        compilerFlags:
          Swift: "-import-objc-header Keyboard/DictusKeyboard-Bridging-Header.h"
    resources:
      - Keyboard/Resources
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: 码上写
        CFBundleShortVersionString: "1.15.0"
        CFBundleVersion: "26"
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mashangxie.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mashangxie.ios.keyboard
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IOS_IPAD: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Keyboard/Keyboard.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(MASHANGXIE_KEYBOARD_PROFILE_SPECIFIER)
        SKIP_INSTALL: "YES"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Keyboard/DictusKeyboard-Bridging-Header.h
        OTHER_LDFLAGS: "-lstdc++"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - target: Shared
      - target: ChineseInput
        embed: true
      - target: RimeKitObjC
        embed: true

  Shared:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mashangxie.ios.shared
        GENERATE_INFOPLIST_FILE: "YES"
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"
        BUILD_LIBRARY_FOR_DISTRIBUTION: "NO"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal

  ChineseInput:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChineseInput/Sources
      - path: ChineseInput/Upstream/HamsterKit/Sources/T9
      - path: ChineseInput/Upstream/HamsterKit/Sources/Trie.swift
      - path: ChineseInput/Upstream/HamsterKit/Sources/Extensions_String+T9.swift
      - path: ChineseInput/Upstream/HamsterKit/Sources/RimeSchema.swift
      - path: ChineseInput/Upstream/HamsterKeyboardKit/Sources/RimeContext/CandidateSuggestion.swift
    postBuildScripts:
      - name: Copy Rime Ice Schemas
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          rm -rf "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Schemas"
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          ditto "$SRCROOT/ChineseInput/Resources/Schemas" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Schemas"
          rm -rf "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Schemas/others"
          rm -rf "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Schemas/.github"
          rm -f "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Schemas/.gitignore"
          rm -f "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Schemas/AGENTS.md"
          rm -f "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Schemas/LICENSE"
          rm -f "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Schemas/README.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mashangxie.ios.chineseinput
        GENERATE_INFOPLIST_FILE: "YES"
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"
        BUILD_LIBRARY_FOR_DISTRIBUTION: "NO"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - target: RimeKitObjC

  RimeKitObjC:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChineseInput/RimeKitObjC
      - path: ChineseInput/Upstream/RimeKit/Sources/ObjC
      - path: ChineseInput/NativeProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mashangxie.ios.rimekitobjc
        GENERATE_INFOPLIST_FILE: "YES"
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"
        BUILD_LIBRARY_FOR_DISTRIBUTION: "NO"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        MODULEMAP_FILE: ChineseInput/RimeKitObjC/module.modulemap
        PUBLIC_HEADERS_FOLDER_PATH: Headers
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/ChineseInput/RimeKitObjC"
          - "$(SRCROOT)/ChineseInput/Upstream/RimeKit/Sources/ObjC/include"
          - "$(SRCROOT)/ChineseInput/Upstream/RimeKit/Sources/C"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        OTHER_LDFLAGS:
          - "-lc++"
    dependencies:
      - framework: ChineseInput/Frameworks/librime.xcframework
      - framework: ChineseInput/Frameworks/boost_atomic.xcframework
      - framework: ChineseInput/Frameworks/boost_filesystem.xcframework
      - framework: ChineseInput/Frameworks/boost_regex.xcframework
      - framework: ChineseInput/Frameworks/boost_system.xcframework
      - framework: ChineseInput/Frameworks/libglog.xcframework
      - framework: ChineseInput/Frameworks/libleveldb.xcframework
      - framework: ChineseInput/Frameworks/libmarisa.xcframework
      - framework: ChineseInput/Frameworks/libopencc.xcframework
      - framework: ChineseInput/Frameworks/libyaml-cpp.xcframework

  RimeNativeLinkProbe:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChineseInput/Upstream/RimeKit/Sources/ObjC
      - path: ChineseInput/Upstream/RimeKit/Sources/C
        buildPhase: headers
      - path: ChineseInput/NativeProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mashangxie.ios.rime-native-link-probe
        GENERATE_INFOPLIST_FILE: "YES"
        DEFINES_MODULE: "NO"
        SKIP_INSTALL: "YES"
        BUILD_LIBRARY_FOR_DISTRIBUTION: "NO"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/ChineseInput/Upstream/RimeKit/Sources/ObjC/include"
          - "$(SRCROOT)/ChineseInput/Upstream/RimeKit/Sources/C"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        OTHER_LDFLAGS:
          - "-lc++"
    dependencies:
      - framework: ChineseInput/Frameworks/librime.xcframework
      - framework: ChineseInput/Frameworks/boost_atomic.xcframework
      - framework: ChineseInput/Frameworks/boost_filesystem.xcframework
      - framework: ChineseInput/Frameworks/boost_regex.xcframework
      - framework: ChineseInput/Frameworks/boost_system.xcframework
      - framework: ChineseInput/Frameworks/libglog.xcframework
      - framework: ChineseInput/Frameworks/libleveldb.xcframework
      - framework: ChineseInput/Frameworks/libmarisa.xcframework
      - framework: ChineseInput/Frameworks/libopencc.xcframework
      - framework: ChineseInput/Frameworks/libyaml-cpp.xcframework

  SharedTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SharedTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mashangxie.ios.shared.tests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Shared

  KeyboardTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Keyboard
        excludes:
          - "Info.plist"
          - "Keyboard.entitlements"
          - "Resources"
        compilerFlags:
          Swift: "-import-objc-header Keyboard/DictusKeyboard-Bridging-Header.h"
      - path: KeyboardTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mashangxie.ios.keyboard.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_OBJC_BRIDGING_HEADER: Keyboard/DictusKeyboard-Bridging-Header.h
        OTHER_LDFLAGS: "-lstdc++"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    dependencies:
      - target: Shared
      - target: ChineseInput

  MashangxieTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MashangxieTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mashangxie.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Mashangxie

  MashangxieUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MashangxieUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mashangxie.ios.ui-tests
        PRODUCT_NAME: 码上写测试
        INFOPLIST_KEY_CFBundleDisplayName: 码上写测试
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Mashangxie
    dependencies:
      - target: Mashangxie

  ChineseInputTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChineseInputTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mashangxie.ios.chineseinput.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - target: ChineseInput

  RimeNativeRuntimeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChineseInput/Upstream/RimeKit/Sources/ObjC
      - path: ChineseInput/Upstream/RimeKit/Sources/C
        buildPhase: headers
      - path: ChineseInput/NativeProbe
      - path: RimeNativeRuntimeTests
    postBuildScripts:
      - name: Copy Rime Ice Schemas
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          rm -rf "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Schemas"
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          ditto "$SRCROOT/ChineseInput/Resources/Schemas" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Schemas"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mashangxie.ios.rime-native-runtime.tests
        GENERATE_INFOPLIST_FILE: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/ChineseInput/Upstream/RimeKit/Sources/ObjC/include"
          - "$(SRCROOT)/ChineseInput/Upstream/RimeKit/Sources/C"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        OTHER_LDFLAGS:
          - "-lc++"
    dependencies:
      - framework: ChineseInput/Frameworks/librime.xcframework
      - framework: ChineseInput/Frameworks/boost_atomic.xcframework
      - framework: ChineseInput/Frameworks/boost_filesystem.xcframework
      - framework: ChineseInput/Frameworks/boost_regex.xcframework
      - framework: ChineseInput/Frameworks/boost_system.xcframework
      - framework: ChineseInput/Frameworks/libglog.xcframework
      - framework: ChineseInput/Frameworks/libleveldb.xcframework
      - framework: ChineseInput/Frameworks/libmarisa.xcframework
      - framework: ChineseInput/Frameworks/libopencc.xcframework
      - framework: ChineseInput/Frameworks/libyaml-cpp.xcframework
