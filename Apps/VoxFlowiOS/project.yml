name: VoxFlowiOS
options:
  bundleIdPrefix: com.voxflow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    GENERATE_INFOPLIST_FILE: "NO"

packages:
  VoxFlow:
    path: ../..

targets:
  VoxFlowiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VoxFlowiOS
        excludes:
          - "Info.plist"
    resources:
      - VoxFlowiOS/Resources
    info:
      path: VoxFlowiOS/Info.plist
      properties:
        CFBundleDisplayName: VoxFlow
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        NSMicrophoneUsageDescription: "VoxFlow 需要麦克风权限以进行语音听写。"
        NSSpeechRecognitionUsageDescription: "VoxFlow 使用系统语音识别作为可选 Provider。"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - armv7
        MinimumOSVersion: "17.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voxflow.ios
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IOS_IPAD: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: VoxFlow
        product: VoxFlowMobileCore
      - package: VoxFlow
        product: VoxFlowASRRuntime
      - package: VoxFlow
        product: VoxFlowAudio
      - package: VoxFlow
        product: VoxFlowProviderCloudCore
      - package: VoxFlow
        product: VoxFlowProviderApple
      - package: VoxFlow
        product: VoxFlowProviderTencentCloud
      - package: VoxFlow
        product: VoxFlowProviderAliyunDashScope
      - package: VoxFlow
        product: VoxFlowProviderVolcengine
